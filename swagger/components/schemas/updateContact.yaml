type: object
properties:
  name:
    description: "Contact's name"
    type: string
    example: 'Robe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380501234567'
  email:
    description: "Contact's email"
    type: string
    example: 'john.doe@example.com'
  photo:
    description: 'Optional contact photo file'
    type: string
    format: binary
  isFavourite:
    description: "Contact's favourite"
    type: boolean
    default: false
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
